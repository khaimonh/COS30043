<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Calculator</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container">
            <h1 class="text-center my-4">Calculator</h1>

            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <input
                                    type="text"
                                    class="form-control form-control-lg text-end"
                                    value="0"
                                    readonly
                                />
                            </div>

                            <div class="mb-2 d-flex gap-2">
                                <button
                                    class="btn btn-outline-secondary btn-sm flex-fill"
                                >
                                    MC
                                </button>
                                <button
                                    class="btn btn-outline-secondary btn-sm flex-fill"
                                >
                                    MR
                                </button>
                                <button
                                    class="btn btn-outline-secondary btn-sm flex-fill"
                                >
                                    M+
                                </button>
                                <button
                                    class="btn btn-outline-secondary btn-sm flex-fill"
                                >
                                    M-
                                </button>
                            </div>

                            <div class="row g-2">
                                <div class="col-8">
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                7
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                8
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                9
                                            </button>
                                        </div>

                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                4
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                5
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                6
                                            </button>
                                        </div>

                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                1
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                2
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                3
                                            </button>
                                        </div>

                                        <div class="col-8">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                0
                                            </button>
                                        </div>
                                        <div class="col-4">
                                            <button
                                                class="btn btn-secondary w-100 btn-lg"
                                            >
                                                .
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-4">
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-warning">
                                            +
                                        </button>
                                        <button class="btn btn-warning">
                                            -
                                        </button>
                                        <button class="btn btn-warning">
                                            ×
                                        </button>
                                        <button class="btn btn-warning">
                                            ÷
                                        </button>
                                        <button class="btn btn-success">
                                            =
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3 d-flex gap-2">
                                <button
                                    class="btn btn-outline-danger flex-fill"
                                >
                                    C
                                </button>
                                <button class="btn btn-outline-dark flex-fill">
                                    ⌫
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
