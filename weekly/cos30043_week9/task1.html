<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/Vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuejs-paginate@3.0.3/dist/vuejs-paginate.min.js"></script>
</head>
<body class="container mt-4">
    <div id="app">
        <table class="table table-bordered">
            <caption>Student marks distribution</caption>
            <thead>
                <tr>
                    <th scope="col" id="h-name">Name</th>
                    <th scope="col" id="h-mark">Mark</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="student in paginatedData" :key="student.name">
                    <td headers="h-name">{{ student.name }}</td>
                    <td headers="h-mark">{{ student.mark }}</td>
                </tr>
            </tbody>
        </table>
        
        <vuejs-paginate
            :data="studMarks"
            :per_page="3"
            v-model="currentPage"
            :scope-id="1"
            class="pagination"
            :previous=" 'Prev Page' "
            :next=" 'Next Page' "
        ></vuejs-paginate>
    </div>

    <script>
        Vue.use(VuejsPaginate);
        new Vue({
            el: '#app',
            data: {
                currentPage: 1,
                studMarks: Array.from({ length: 26 }, (_, i) => ({
                    name: `Student ${i + 1}`,
                    mark: Math.floor(Math.random() * 100)
                }))
            },
            computed: {
                paginatedData() {
                    const start = (this.currentPage - 1) * 3;
                    return this.studMarks.slice(start, start + 3);
                }
            }
        });
    </script>
</body>
</html>
