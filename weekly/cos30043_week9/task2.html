<!DOCTYPE html>
<html >
<head>
    <title>Units Table Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/Vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuejs-paginate@3.0.3/dist/vuejs-paginate.min.js"></script>
</head>
<body class="container mt-4">
    <div id="app">
        <table class="table table-bordered" v-if="units.length">
            <caption>University units listing</caption>
            <thead>
                <tr>
                    <th scope="col" id="h-code">Code</th>
                    <th scope="col" id="h-desc">Description</th>
                    <th scope="col" id="h-cp">CP</th>
                    <th scope="col" id="h-type">Type</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="unit in paginatedData" :key="unit.code">
                    <td headers="h-code">{{ unit.code }}</td>
                    <td headers="h-desc">{{ unit.desc }}</td>
                    <td headers="h-cp">{{ unit.cp }}</td>
                    <td headers="h-type">{{ unit.type }}</td>
                </tr>
            </tbody>
        </table>
        
        <vuejs-paginate
            v-if="units.length"
            :data="units"
            :per_page="5"
            v-model="currentPage"
            :scope-id="2"
            class="pagination"
        ></vuejs-paginate>
    </div>

    <script>
        Vue.use(VuejsPaginate);
        new Vue({
            el: '#app',
            data: {
                currentPage: 1,
                units: []
            },
            computed: {
                paginatedData() {
                    const start = (this.currentPage - 1) * 5;
                    return this.units.slice(start, start + 5);
                }
            },
            mounted() {
                fetch('units.json')
                    .then(res => res.json())
                    .then(data => { this.units = data; })
                    .catch(err => console.error('Error fetching units:', err));
            }
        });
    </script>
</body>
</html>
