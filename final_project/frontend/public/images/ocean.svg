<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ocean scene at dusk">
  <defs>
    <linearGradient id="sea-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1330"/>
      <stop offset="0.5" stop-color="#1c2b5e"/>
      <stop offset="1" stop-color="#2c447f"/>
    </linearGradient>
    <linearGradient id="sea-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a78"/>
      <stop offset="0.5" stop-color="#12264f"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="sea-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a9c4ff"/>
      <stop offset="1" stop-color="#a9c4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sea-reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb8f2" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9fb8f2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sea-sky)"/>
  <circle cx="400" cy="180" r="110" fill="url(#sea-sun)"/>
  <circle cx="400" cy="180" r="46" fill="#cdd9ff" opacity="0.95"/>
  <circle cx="400" cy="180" r="32" fill="#f2f5ff"/>
  <circle cx="110" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="230" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="650" cy="90" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="720" cy="45" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="540" cy="60" r="1.5" fill="#ffffff" opacity="0.5"/>

  <rect x="330" y="330" width="140" height="4" fill="url(#sea-reflection)"/>

  <path d="M0 230 Q100 244 200 230 T400 230 T600 230 T800 230 L800 500 L0 500 Z" fill="url(#sea-water)"/>

  <g fill="none" stroke="#6f92e0" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M0 290 Q60 283 120 290 T240 290 T360 290 T480 290 T600 290 T720 290 T800 290" stroke-width="2.5"/>
    <path d="M0 330 Q60 323 120 330 T240 330 T360 330 T480 330 T600 330 T720 330 T800 330" stroke-width="2"/>
    <path d="M0 370 Q60 364 120 370 T240 370 T360 370 T480 370 T600 370 T720 370 T800 370" stroke-width="2"/>
    <path d="M0 410 Q60 404 120 410 T240 410 T360 410 T480 410 T600 410 T720 410 T800 410" stroke-width="1.5"/>
  </g>

  <g>
    <path d="M620 250 L628 268 L636 250 L628 256 Z" fill="#dfe7ff" opacity="0.9"/>
    <path d="M612 268 Q628 262 644 268 L652 250 L612 250 Z" fill="#dfe7ff" opacity="0.9"/>
    <line x1="628" y1="268" x2="628" y2="244" stroke="#cdd9ff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
